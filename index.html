<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGVAULT</title>
    <meta
      name="description"
      content="OGVAULT is a Kill Race token lobby for OG Fortnite projects. List a match on Eon or Retrac, ready up, and settle the pot."
    />
    <link rel="icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #root:has(.boot) {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07080d;
      }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 24px;
      }
      .boot-vault {
        position: relative;
        width: min(360px, 78vw);
        aspect-ratio: 1;
        mix-blend-mode: screen;
      }
      .boot-vault img { width: 100%; height: 100%; display: block; }
      .boot-vault span { position: absolute; inset: 0; clip-path: circle(10.8% at 41.7% 42.8%); }
      .boot-vault .hole { background: #000; }
      .boot-vault .wheel {
        transform-origin: 41.7% 42.8%;
        animation: boot-spin 1.8s cubic-bezier(0.6, 0, 0.25, 1) infinite;
      }
      @keyframes boot-spin {
        0% { transform: rotate(0deg); }
        70% { transform: rotate(-400deg); }
        100% { transform: rotate(-360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-vault .wheel { animation: none; }
      }
      .boot p {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9aa6bd;
      }
      .boot-bar {
        width: min(250px, 70vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(244, 247, 251, 0.1);
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        height: 100%;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #6d8dff 40%, #f4f7fb);
        animation: boot-sweep 1.15s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(340%); }
      }
    </style>
  </head>
  <body style="margin:0;background:#07080d;color:#f4f7fb;font-family:Inter,Segoe UI,sans-serif">
    <div id="root">
      <div class="boot">
        <div class="boot-vault" role="img" aria-label="OGVAULT">
          <img src="/logo.png" alt="" />
          <span class="hole"></span>
          <span class="wheel"><img src="/logo.png" alt="" /></span>
        </div>
        <p>Loading</p>
        <div class="boot-bar" role="progressbar" aria-label="Loading"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
